<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수학 전략 오락실 | JB Math</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../../index.html">← JB Math 웹툴</a><span>생각하고 · 선택하고 · 설명하기</span></header><main><p class="eyebrow">JB MATH · PLAY & DISCOVER</p><h1>수학 전략 오락실</h1><p>한 번의 선택에 수학적 이유를 담아보세요.</p><nav aria-label="게임 선택"><button data-game="factors">01 약수·배수 대결</button><button data-game="nim">02 님 전략게임</button><button data-game="line">03 일차함수 좌표 미션</button></nav><section class="panel"><h2 id="title"></h2><p id="rules"></p><div class="controls"><label id="mode-label">상대 <select id="mode"><option value="duo">친구와 2인</option><option value="cpu">컴퓨터</option></select></label><label id="size-label">숫자 범위 <select id="size"><option value="30">1~30</option><option value="60">1~60</option><option value="100">1~100</option></select></label><button id="reset">새 게임</button><button id="hint">힌트 보기</button></div><p id="status" role="status" aria-live="polite"></p><div id="board"></div><p id="feedback" aria-live="polite"></p><details><summary>수업 활용·생각할 질문·참고 자료</summary><div id="guide"></div><p>약수·배수 대결 참고: <a href="https://nrich.maths.org/games/factors-and-multiples-game" target="_blank" rel="noreferrer">NRICH Factors and Multiples</a>. 시작 숫자 제한 없이 진행하는 변형입니다. 님은 마지막 돌을 가져가는 사람이 이기는 일반 님 규칙입니다. 화면·코드는 JB Math용으로 직접 구현했습니다.</p></details></section><section class="panel"><h2>전략 한 줄 기록</h2><label for="reflection">내가 선택한 이유 / 발견한 규칙</label><textarea id="reflection" placeholder="예: 큰 소수를 고르면 상대가 선택할 수 있는 수는…"></textarea><p>기록은 화면에만 남습니다. 새로고침 전에 복사해 두세요.</p></section></main><script src="model.js"></script><script src="app.js"></script></body></html>
