<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#184c6b">
<title>함께 주문 | 참여자 주문 페이지</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#193145;background:#f5f8fa}
*{box-sizing:border-box}body{margin:0}header{background:#184c6b;color:#fff;padding:17px 15px}
header strong{font-size:1.25rem}header small{display:block;color:#dfedf5;margin-top:4px}
.wrap{max-width:850px;margin:auto;padding:12px}
.card{background:#fff;border:1px solid #dbe5eb;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #18394a08}
h2{font-size:1.08rem;margin:0 0 12px}h3{font-size:.98rem;margin:15px 0 8px}
label{display:block;font-weight:650;font-size:.88rem;margin:11px 0 6px}
button,input{font:inherit}button{border:0;background:#185f84;color:#fff;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:650}
button:disabled{opacity:.5;cursor:not-allowed}.subtle{background:#e9f2f7;color:#184c6b}
input{padding:11px;width:100%;border:1px solid #b9cbd4;border-radius:9px;color:#20384b;background:#fff}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{min-width:0}.row input{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.note,.muted{font-size:.86rem;color:#657783;line-height:1.55}
#status{min-height:25px;color:#a14720;font-size:.9rem;white-space:pre-wrap}
[hidden]{display:none!important}
.pill{display:inline-block;border-radius:30px;padding:5px 9px;background:#eaf3f7;color:#2a627b;font-size:.8rem}
.store-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.store-tab{white-space:nowrap;flex:none;padding:11px 14px;background:#e7f0f5;color:#244f67;border:2px solid transparent}
.store-tab[aria-selected=true]{background:#185f84;color:#fff}
.store-tab small{display:block;font-weight:400;margin-top:3px;opacity:.85}
.photo-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 16px}
.choice{background:#f9fcfd;color:#153d56;border:2px solid #d9e5ec;border-radius:12px;text-align:left;display:flex;cursor:pointer;font-weight:650}
.choice.is-selected{border-color:#117caf;background:#e8f5fc}
.photo-choice{padding:0;overflow:hidden;flex-direction:column}
.photo-choice img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#edf3f5}
.photo-choice .choice-info{display:flex;flex-direction:column;gap:5px;padding:11px}
.choice small{color:#36667d;font-weight:500}
.text-choices{display:flex;flex-direction:column;gap:7px;margin:10px 0 16px}
.text-choice{padding:14px;align-items:center;justify-content:space-between;gap:8px}
.text-choice strong{flex:1}.text-choice small{white-space:nowrap}
.full-button{display:block;width:100%;padding:15px 14px;font-size:1.05rem}
.option-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.option-chip{border:2px solid #d5e3ea;background:#f8fbfd;color:#214e67;padding:9px 11px;border-radius:10px;font-size:.9rem}
.option-chip[aria-pressed="true"]{background:#dbf1fc;border-color:#117caf;color:#114b6c}
.option-chip small{display:block;margin-top:3px;font-size:.78rem}
#orderEstimate{margin:10px 0;color:#185f84;font-weight:750}
.info-row{padding:10px 0;border-top:1px solid #e9eff2}
.info-row:first-child{border:0}
.confirmed{margin-top:14px;padding:14px;border-radius:12px;background:#f0faf5;border:1px solid #c7e4d7}
.summary{font-size:1.4rem;font-weight:800;color:#185f84;margin:4px 0}
#grandTotal{font-size:1.1rem}
@media(min-width:760px){.order-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:start}}
@media(max-width:370px){.photo-choices{gap:7px}.photo-choice .choice-info{padding:8px}.store-tab{padding:9px}}
</style>
</head>
<body>
<header><div style="max-width:850px;margin:auto"><strong>함께 주문</strong><small>매장별 메뉴 선택 · 모두의 주문 현황</small></div></header>
<main class="wrap">
<div id="status" role="status" aria-live="polite"></div>
<section id="needInvite" class="card" hidden>
 <h2>주문방 초대 링크가 필요합니다</h2>
 <p class="note">방장이 공유한 참여 링크 또는 QR코드를 열어주세요. 이 페이지에서는 주문방을 직접 만들지 않습니다.</p>
</section>
<section id="loading" class="card"><h2>주문방에 연결하는 중입니다</h2><p class="note">인터넷 연결을 확인해 주세요.</p></section>
<div id="app" hidden>
 <section class="card">
  <div class="between"><h2>매장별 주문</h2><span id="roomState" class="pill">접수 중</span></div>
  <div id="storeTabs" class="store-tabs" role="tablist" aria-label="매장 선택"></div>
 </section>
 <div class="order-layout">
  <section class="card" id="orderCard">
   <h2><span id="storeTitle"></span> 메뉴 선택</h2>
   <label for="nick">이름 또는 닉네임</label>
   <div class="row"><input id="nick" maxlength="30" placeholder="예: 김선생 / 햇살" autocomplete="nickname"><button id="saveNick" class="subtle" type="button">저장</button></div>
   <div id="newOrder">
    <h3>주문할 메뉴</h3><p class="note">사진을 누르거나 목록에서 메뉴를 선택해주세요.</p>
    <div id="menuChoices" role="group" aria-label="메뉴 선택"></div>
    <div class="row">
     <div style="flex:1"><label for="qty">수량</label><input id="qty" type="number" min="1" max="99" value="1" inputmode="numeric"></div>
     <div style="flex:2"><label for="option">옵션 (선택)</label><input id="option" maxlength="70" placeholder="아이스, 샷 추가 등"></div>
    </div>
    <div id="paidOptionWrap" hidden><label>추가 옵션 (필요하면 선택)</label><div id="optionChoices" class="option-chips" role="group" aria-label="추가 옵션 선택"></div></div>
    <p id="orderEstimate" aria-live="polite">메뉴를 선택해주세요.</p>
    <button id="addOrder" class="full-button" style="margin-top:13px" type="button">이 메뉴로 주문 확정</button>
    <p class="note" id="replaceNote" hidden>새 주문을 확정할 때까지 기존 주문은 유지됩니다.</p>
   </div>
   <div id="myItems" aria-live="polite"></div>
  </section>
  <section class="card">
   <h2><span id="summaryStoreTitle"></span> 전체 선택 현황</h2>
   <div class="row"><span id="totalPeople" class="pill">0명</span><span id="totalItems" class="pill">0개</span></div>
   <p class="summary" id="grandTotal">0원</p>
   <p class="note" id="allStoreTotals">전체 매장 합계 0원</p>
   <h3>메뉴별 합계</h3><div id="byMenu"></div>
   <h3>주문자별 내역</h3><div id="byPerson"></div>
  </section>
 </div>
</div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,set,get,onValue} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("ko-KR")+"원";
const DEFAULT_STORE_ID="store-default";
let db,uid,room,current=null,activeStoreId=DEFAULT_STORE_ID,reselecting=new Set(),selectedMenuId="",selectedOptionIds=new Set();
function say(message){$("status").textContent=message}
function decodeConfig(s){return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))))}
function itemsOf(v){return Array.isArray(v)?v:(v&&typeof v==="object"?Object.values(v):[])}
function allMenus(){return Array.isArray(current?.menu)?current.menu:[]}
function menuItems(){return allMenus().filter(x=>x&&x.kind!=="store"&&x.kind!=="option")}
function optionItems(){return allMenus().filter(x=>x&&x.kind==="option")}
function storeOptions(){return optionItems().filter(x=>(x.storeId||DEFAULT_STORE_ID)===activeStoreId)}
function orderAddons(x){
 const list=Array.isArray(x.selectedOptions)?x.selectedOptions:[];
 if(list.length)return list.map(o=>{const now=optionItems().find(m=>m.id===o.id);return {name:now?.name||o.name||"추가 옵션",price:Number(now?.price??o.price??0)}});
 return Array.isArray(x.optionIds)?x.optionIds.map(id=>optionItems().find(m=>m.id===id)).filter(Boolean).map(m=>({name:m.name,price:Number(m.price)||0})):[];
}
function getStores(){
 const list=allMenus().filter(x=>x?.kind==="store"&&typeof x.id==="string"&&x.name);
 const initial=list.find(x=>x.id===DEFAULT_STORE_ID);
 return [{id:DEFAULT_STORE_ID,name:initial?.name||"기본 매장"},...list.filter(x=>x.id!==DEFAULT_STORE_ID).map(x=>({id:x.id,name:x.name}))];
}
function menuStore(x){return x.storeId||DEFAULT_STORE_ID}
function itemStore(x){return x.storeId||menuItems().find(m=>m.id===x.menuId)?.storeId||DEFAULT_STORE_ID}
function info(x){
 const found=menuItems().find(m=>m.id===x.menuId);
 const addons=orderAddons(x);
 return {name:found?.name||x.name||"삭제된 메뉴",price:Number(found?.price??x.price??0)+addons.reduce((v,o)=>v+o.price,0),basePrice:Number(found?.price??x.price??0),qty:Number(x.qty||1),option:[...addons.map(o=>o.name),x.option||""].filter(Boolean).join(" · ")};
}
function mine(){return current?.orders?.[uid]||{nick:"",items:[]}}
function safePhoto(v){return typeof v==="string"&&v.length<=90000&&/^data:image\/jpeg;base64,[a-z0-9+/=]+$/i.test(v)}
function currentOrders(){
 return Object.entries(current?.orders||{}).map(([id,o])=>[id,{...o,items:itemsOf(o.items)}]).filter(([_,o])=>o.items.length);
}
function updateOrderEstimate(){
 const picked=menuItems().find(m=>m.id===selectedMenuId&&(m.storeId||DEFAULT_STORE_ID)===activeStoreId);
 const qty=Number($("qty").value);
 if(!picked||!Number.isInteger(qty)||qty<1){$("orderEstimate").textContent="메뉴를 선택해주세요.";return;}
 const additions=storeOptions().filter(x=>selectedOptionIds.has(x.id)).reduce((sum,x)=>sum+(Number(x.price)||0),0);
 $("orderEstimate").textContent="예상 결제금액 "+money((Number(picked.price)+additions)*qty)+" (메뉴 "+money(picked.price)+" + 옵션 "+money(additions)+") × "+qty+"개";
}
function render(){
 if(!current)return;
 const stores=getStores();
 if(!stores.some(s=>s.id===activeStoreId))activeStoreId=DEFAULT_STORE_ID;
 const store=stores.find(s=>s.id===activeStoreId);
 const closed=!!current.closed,own=mine(),previous=itemsOf(own.items);
 const existingHere=previous.filter(x=>itemStore(x)===activeStoreId);
 const all=currentOrders();
 $("roomState").textContent=closed?"주문 마감":"주문 접수 중";
 const counts=new Map(stores.map(s=>[s.id,all.filter(([_,o])=>o.items.some(x=>itemStore(x)===s.id)).length]));
 $("storeTabs").innerHTML=stores.map(s=>'<button type="button" class="store-tab" role="tab" data-store-id="'+esc(s.id)+'" aria-selected="'+(s.id===activeStoreId?'true':'false')+'">'+esc(s.name)+'<small>'+(counts.get(s.id)||0)+'명 주문</small></button>').join("");
 $("storeTitle").textContent=store.name;
 $("summaryStoreTitle").textContent=store.name;
 $("newOrder").hidden=closed||(existingHere.length>0&&!reselecting.has(activeStoreId));
 $("replaceNote").hidden=!existingHere.length;
 $("nick").disabled=closed;$("saveNick").disabled=closed;
 if(document.activeElement!==$("nick")&&own.nick)$("nick").value=own.nick;
 const menu=menuItems().filter(m=>menuStore(m)===activeStoreId);
 const paid=storeOptions();
 for(const id of [...selectedOptionIds])if(!paid.some(o=>o.id===id))selectedOptionIds.delete(id);
 $("paidOptionWrap").hidden=!paid.length;
 $("optionChoices").innerHTML=paid.map(o=>'<button type="button" class="option-chip" data-option-id="'+esc(o.id)+'" aria-pressed="'+(selectedOptionIds.has(o.id)?'true':'false')+'" '+(closed?'disabled':'')+'>'+esc(o.name)+'<small>+'+money(o.price)+'</small></button>').join("");
 if(!menu.some(m=>m.id===selectedMenuId))selectedMenuId="";
 const photo=menu.filter(m=>safePhoto(m.imageData));
 const text=menu.filter(m=>!safePhoto(m.imageData));
 const attributes=m=>'data-menu-id="'+esc(m.id)+'" aria-pressed="'+(selectedMenuId===m.id?'true':'false')+'" '+(closed?'disabled':'');
 const marker=m=>(m.id===selectedMenuId?' is-selected':'');
 $("menuChoices").innerHTML=menu.length?
 (photo.length?'<div class="photo-choices">'+photo.map(m=>'<button type="button" class="choice photo-choice'+marker(m)+'" '+attributes(m)+'><img loading="lazy" alt="'+esc(m.name)+' 사진" src="'+m.imageData+'"><span class="choice-info"><strong>'+esc(m.name)+'</strong><small>'+money(m.price)+'</small></span></button>').join("")+'</div>':'')+
 (text.length?'<div class="text-choices">'+text.map(m=>'<button type="button" class="choice text-choice'+marker(m)+'" '+attributes(m)+'><strong>'+esc(m.name)+'</strong><small>'+money(m.price)+'</small></button>').join("")+'</div>':'')
 :'<p class="note">방장이 이 매장의 메뉴를 등록하면 나타납니다.</p>';
 const selectedOrders=all.map(([id,o])=>[id,{...o,items:o.items.filter(x=>itemStore(x)===activeStoreId)}]).filter(([_,o])=>o.items.length);
 const totalQty=selectedOrders.reduce((v,[_,o])=>v+o.items.reduce((t,x)=>t+(Number(x.qty)||0),0),0);
 let total=0;const groups=new Map();
 for(const [id,o] of selectedOrders)for(const x of o.items){
  const d=info(x);total+=d.price*d.qty;
  const key=d.name+"§"+d.price+"§"+d.option;
  const g=groups.get(key)||{...d,qty:0};g.qty+=d.qty;groups.set(key,g);
 }
 const fullTotal=all.reduce((t,[_,o])=>t+o.items.reduce((v,x)=>{const d=info(x);return v+d.price*d.qty},0),0);
 $("totalPeople").textContent=selectedOrders.length+"명 주문";
 $("totalItems").textContent=totalQty+"개";
 $("grandTotal").textContent=money(total);
 $("allStoreTotals").textContent="전체 매장 합계 "+money(fullTotal);
 $("byMenu").innerHTML=groups.size?[...groups.values()].map(d=>'<div class="between info-row"><span>'+esc(d.name)+(d.option?' <small>('+esc(d.option)+')</small>':'')+' ×'+d.qty+'</span><strong>'+money(d.qty*d.price)+'</strong></div>').join(""):'<p class="note">아직 주문이 없습니다.</p>';
 $("byPerson").innerHTML=selectedOrders.length?selectedOrders.map(([id,o])=>{
  const sub=o.items.reduce((v,x)=>{const d=info(x);return v+d.price*d.qty},0);
  return '<div class="info-row"><div class="between"><strong>'+esc(o.nick||"이름 없음")+'</strong><strong>'+money(sub)+'</strong></div>'+o.items.map(x=>{const d=info(x);return '<div class="note">'+esc(d.name)+(d.option?" · "+esc(d.option):"")+' ×'+d.qty+'</div>'}).join("")+'</div>';
 }).join(""):'<p class="note">참여자의 주문이 여기에 표시됩니다.</p>';
 updateOrderEstimate();
 const myTotal=existingHere.reduce((v,x)=>{const d=info(x);return v+d.price*d.qty},0);
 $("myItems").innerHTML=existingHere.length?
 '<div class="confirmed"><div class="between"><strong>내가 선택한 메뉴</strong><span class="pill">'+(closed?"마감":"선택 완료")+'</span></div>'+
 existingHere.map(x=>{const d=info(x);return '<div class="between info-row"><span>'+esc(d.name)+(d.option?'<small> · '+esc(d.option)+'</small>':'')+' ×'+d.qty+'</span><strong>'+money(d.price*d.qty)+'</strong></div>'}).join("")+
 '<div class="between" style="margin:11px 0"><strong>이 매장 내 합계</strong><strong>'+money(myTotal)+'</strong></div>'+
 (!closed?'<button type="button" class="subtle" id="reselectOrder">다시 선택하기</button>':'')+
 '</div>':(closed?'<p class="note">이 매장 주문이 마감되었습니다.</p>':'');
}
function setStore(id){
 if(!getStores().some(s=>s.id===id))return;
 activeStoreId=id;selectedMenuId="";selectedOptionIds.clear();$("qty").value="1";$("option").value="";render();
}
async function writeOrder(items,nick){
 if(!current||current.closed)throw Error("주문이 마감되었습니다.");
 const name=String(nick??$("nick").value).trim();
 if(!name)throw Error("닉네임을 입력해주세요.");
 await set(ref(db,"rooms/"+room+"/orders/"+uid),{nick:name,items,updatedAt:Date.now()});
}
async function act(fn){try{await fn()}catch(e){say(e.message||String(e))}}
$("storeTabs").onclick=e=>{
 const b=e.target.closest("button[data-store-id]");
 if(b)setStore(b.dataset.storeId);
};
$("menuChoices").onclick=e=>{
 const b=e.target.closest("button[data-menu-id]");if(!b||b.disabled)return;
 selectedMenuId=b.dataset.menuId;
 updateOrderEstimate();
 $("menuChoices").querySelectorAll("button[data-menu-id]").forEach(x=>{
  const picked=x.dataset.menuId===selectedMenuId;
  x.classList.toggle("is-selected",picked);x.setAttribute("aria-pressed",String(picked));
 });
};
$("optionChoices").onclick=e=>{
 const b=e.target.closest("button[data-option-id]");if(!b||b.disabled)return;
 const id=b.dataset.optionId;
 if(selectedOptionIds.has(id))selectedOptionIds.delete(id);else selectedOptionIds.add(id);
 b.setAttribute("aria-pressed",selectedOptionIds.has(id)?"true":"false");updateOrderEstimate();
};
$("qty").oninput=updateOrderEstimate;
$("saveNick").onclick=()=>act(async()=>{
 await writeOrder(itemsOf(mine().items));say("닉네임이 저장되었습니다.");
});
$("addOrder").onclick=()=>act(async()=>{
 const storeId=activeStoreId;
 const chosen=menuItems().find(m=>m.id===selectedMenuId&&menuStore(m)===storeId);
 const qty=Number($("qty").value),option=$("option").value.trim();
 const selectedOptions=storeOptions().filter(o=>selectedOptionIds.has(o.id)).map(o=>({id:o.id,name:o.name,price:Number(o.price)||0}));
 if(!chosen)throw Error("메뉴를 선택해주세요.");
 if(!Number.isInteger(qty)||qty<1||qty>99)throw Error("수량은 1~99개 사이의 정수로 입력해주세요.");
 const previous=itemsOf(mine().items);
 if(previous.filter(x=>itemStore(x)===storeId).length>1&&!confirm("이 매장의 여러 주문을 새 메뉴 하나로 교체하시겠습니까?"))return;
 const kept=previous.filter(x=>itemStore(x)!==storeId);
 await writeOrder([...kept,{menuId:chosen.id,storeId,name:chosen.name,price:chosen.price,qty,option,selectedOptions}]);
 reselecting.delete(storeId);selectedMenuId="";selectedOptionIds.clear();$("qty").value="1";$("option").value="";
 render();say("주문이 저장되었습니다. 다른 매장의 선택은 유지됩니다.");
});
$("myItems").onclick=e=>{
 if(!e.target.closest("#reselectOrder")||current.closed)return;
 reselecting.add(activeStoreId);selectedMenuId="";selectedOptionIds.clear();$("qty").value="1";$("option").value="";
 render();$("orderCard").scrollIntoView({behavior:"smooth",block:"start"});
};
(async()=>{
 const u=new URL(location.href),r=u.searchParams.get("r"),cfg=u.searchParams.get("cfg");
 if(!r||!cfg){$("loading").hidden=true;$("needInvite").hidden=false;return;}
 try{
  const config=decodeConfig(cfg);
  if(!config.apiKey||!config.projectId||!config.databaseURL||!config.appId)throw Error("초대 링크의 Firebase 설정이 올바르지 않습니다.");
  const app=initializeApp(config);
  const credential=await signInAnonymously(getAuth(app));
  uid=credential.user.uid;room=r;db=getDatabase(app);
  const doc=await get(ref(db,"rooms/"+room));
  if(!doc.exists())throw Error("주문방이 없습니다. 방장에게 새로운 참여 링크를 요청해주세요.");
  if(doc.val().hostUid===uid){
   const hostLink=new URL("./admin.html",location.href);
   hostLink.search=location.search;hostLink.hash="";
   location.replace(hostLink.href);return;
  }
  $("loading").hidden=true;$("app").hidden=false;
  onValue(ref(db,"rooms/"+room),snapshot=>{
   current=snapshot.val();
   if(current){render();say("");}
   else say("주문방을 찾을 수 없습니다.");
  },err=>say("실시간 연결에 실패했습니다: "+err.message));
 }catch(e){$("loading").hidden=true; $("needInvite").hidden=false; say(e.message||String(e));}
})();
</script>
</body></html>
